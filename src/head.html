<!DOCTYPE html>
<html lang="hr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ff86c0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Dugina trka</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff6fae;--pinkd:#b0447e;--lil:#a37bff;--cream:#fff8f0;--ink:#5a2a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe3f2;font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer;border:0}
.btn{background:linear-gradient(#ff9ccb,#ff5fa6);color:#fff;font-weight:800;font-size:clamp(22px,3.6vh,34px);padding:.35em 1.2em;border-radius:999px;box-shadow:0 6px 0 #b0447e,0 10px 20px rgba(120,40,90,.25);text-shadow:0 2px 0 rgba(140,30,90,.4);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b0447e}
.btn.alt{background:linear-gradient(#c7b0ff,#9a74ff);box-shadow:0 6px 0 #6a48c0,0 10px 20px rgba(80,40,140,.25)}
.btn.yel{background:linear-gradient(#ffe48a,#ffb93d);color:#7a4a00;text-shadow:none;box-shadow:0 6px 0 #c9861a,0 10px 20px rgba(140,90,20,.25)}
.rbtn{width:clamp(52px,8.5vh,72px);height:clamp(52px,8.5vh,72px);border-radius:50%;background:linear-gradient(#ffd27a,#ff9b3d);color:#fff;font-size:clamp(24px,4vh,34px);font-weight:800;box-shadow:0 4px 0 #c9661a,0 6px 12px rgba(0,0,0,.18);display:grid;place-items:center;border:3px solid #fff}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2.2vh;z-index:5;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.scr.on{display:flex}
.panel{background:rgba(255,250,246,.94);border:5px solid #fff;border-radius:34px;box-shadow:0 12px 40px rgba(120,60,140,.3);padding:3vh 4vw;text-align:center;max-width:min(760px,94vw);max-height:92vh;overflow:auto}
.title{font-size:clamp(46px,11vh,104px);font-weight:800;line-height:.95;margin:0;color:#fff;text-shadow:0 5px 0 #ff5fa6,0 9px 0 #a37bff,0 14px 24px rgba(90,40,120,.35);letter-spacing:1px;text-align:center}
.sub{font-size:clamp(18px,3.4vh,28px);font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(120,40,120,.6);margin:0;text-align:center}
#sTitle{justify-content:flex-start;padding-top:5vh}
#sTitle .row{position:fixed;bottom:5vh;left:0;right:0;display:flex;gap:16px;justify-content:center;align-items:center}
#hud{position:fixed;left:0;right:0;top:0;display:none;align-items:flex-start;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 0;z-index:4;pointer-events:none}
#hud>*{pointer-events:auto}
#hHearts{display:flex;gap:2px;font-size:clamp(34px,6.2vh,54px);line-height:1;margin-top:2px}
.ht{color:#ff4f8f;text-shadow:0 0 0 #fff,0 3px 0 #b02a5a,0 0 8px #fff}.ht.off{color:#d7cfe0;text-shadow:0 3px 0 #a8a0b8}
#hStars{font-size:clamp(26px,4.4vh,38px);color:#ffd84d;text-shadow:0 3px 0 #c98a10;margin-top:6px;letter-spacing:2px}#hStars .off{color:rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(120,100,140,.4)}
.pill{margin-left:auto;background:#fff;border-radius:999px;padding:4px 16px 4px 8px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(24px,4.4vh,36px);color:#5a3a7a;box-shadow:0 4px 10px rgba(0,0,0,.12);border:3px solid #ffd3ec}
.rg{display:inline-block;width:1em;height:1em;border-radius:50%;border:.2em solid #ff5fb8;box-shadow:inset 0 0 0 .05em #d92f8f,0 0 0 .04em #d92f8f;vertical-align:-.12em}
#prog{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 14px);width:min(28vw,300px);height:12px;background:rgba(255,255,255,.6);border-radius:9px;border:2px solid #fff;overflow:hidden}
#pFill{height:100%;width:0;background:linear-gradient(90deg,#ff5d8f,#ffa64d,#ffe14d,#6ee07a,#5ec8ff,#a37bff);border-radius:9px}
h2{margin:0;font-size:clamp(32px,7vh,60px);color:#ff5fa6;text-shadow:0 3px 0 #fff,0 5px 0 rgba(176,68,126,.3)}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:1vh}
#wStars{font-size:clamp(60px,13vh,110px);line-height:1;display:flex;gap:8px;justify-content:center}
.ws{color:#e5dff0;text-shadow:0 5px 0 #b8afc8}.ws.on{color:#ffd84d;text-shadow:0 5px 0 #c98a10,0 0 30px #fff3a0;animation:pop .5s both}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.big{font-size:clamp(28px,5.5vh,46px);font-weight:800;color:#b0447e;display:flex;gap:10px;align-items:center;justify-content:center}
#sMap{pointer-events:none;justify-content:flex-start}
#sMap>*{pointer-events:auto}
#mapTop{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:16px;right:16px;display:flex;align-items:center;gap:12px}
#mapTitle{flex:1;text-align:center;font-size:clamp(28px,6vh,52px);font-weight:800;color:#fff;text-shadow:0 3px 0 #ff5fa6,0 6px 12px rgba(90,40,120,.4)}
#mapBot{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}#mapBot>*{pointer-events:auto}
.arw{font-size:clamp(28px,5vh,40px)}
#sShop .panel{width:min(980px,96vw)}
#shUps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin:10px 0 16px}
.it{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:10px 14px;border:3px solid #ffe0f0;text-align:left}
.it .ic{font-size:40px}.it .tx{flex:1;line-height:1.1}.it small{display:block;font-weight:600;color:#9a7aa8;font-size:15px}
.dots{display:flex;gap:5px;margin-top:5px}.dots i{width:16px;height:16px;border-radius:50%;background:#eee3f2;border:2px solid #d8c8e4}.dots i.on{background:#ff6fae;border-color:#b0447e}
.buy{background:linear-gradient(#ffe48a,#ffb93d);color:#7a4a00;font-weight:800;font-size:22px;border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 #c9861a;display:flex;align-items:center;gap:6px;white-space:nowrap}
.buy.no{filter:grayscale(.8);opacity:.6}.buy.max{background:#9de8a0;box-shadow:0 4px 0 #4f9a49;color:#fff}
#shUnis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.uni{background:#fff;border-radius:22px;border:4px solid #f0e6f6;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:20px}
.uni canvas{width:100%;max-width:150px;height:auto}.uni.sel{border-color:#ff6fae;box-shadow:0 0 0 4px #ffd3ec}
.uni .pr{font-weight:800;color:#c9861a;display:flex;gap:4px;align-items:center}
.shHead{display:flex;align-items:center;gap:12px;justify-content:space-between}
#stS{font-size:clamp(20px,3.8vh,30px);font-weight:600;line-height:1.25;margin:1vh 0 2vh}
#rot{position:fixed;inset:0;z-index:20;background:linear-gradient(#ffb3d9,#c7b0ff);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:30px;font-weight:800;text-align:center;padding:20px}
#rot.on{display:flex}#rot div{font-size:90px;animation:rt 1.6s infinite}@keyframes rt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><button class="rbtn" id="hPause">II</button><div id="hHearts"></div><div id="hStars"></div><div id="prog"><div id="pFill"></div></div><div class="pill"><span class="rg"></span><span id="hRings">0</span></div></div>
<div class="scr on" id="sTitle"><h1 class="title">Dugina trka</h1><p class="sub">Leona i jednorog vraćaju boje ✨</p>
 <div class="row"><button class="rbtn bMus">🎵</button><button class="btn" id="bPlay">Igraj ▶</button><button class="btn alt" id="bShop">🛍️ Trgovina</button></div></div>
<div class="scr" id="sStory"><div class="panel"><h2 id="stT"></h2><p id="stS"></p><button class="btn" id="stGo">Kreni! ▶</button></div></div>
<div class="scr" id="sMap"><div id="mapTop"><button class="rbtn" id="mapBack">⌂</button><button class="rbtn arw" id="mapPrev">◀</button><div id="mapTitle"></div><button class="rbtn arw" id="mapNext">▶</button><div class="pill" style="margin-left:0"><span class="rg"></span><span id="mapRings">0</span></div></div>
 <div id="mapBot"><button class="rbtn bMus">🎵</button><button class="btn alt" id="bShop2">🛍️ Trgovina</button></div></div>
<div class="scr" id="sPause"><div class="panel"><h2>Pauza</h2><div class="btns"><button class="btn" id="pCont">Nastavi ▶</button><button class="btn yel" id="pRetry">↻ Ispočetka</button><button class="btn alt" id="pMap">🗺️ Karta</button><button class="rbtn bMus">🎵</button></div></div></div>
<div class="scr" id="sWin"><div class="panel"><h2 id="wTitle">Bravo!</h2><div id="wStars"></div><div class="big"><span class="rg"></span><span id="wRings">+0</span></div><div style="font-weight:800;color:#a37bff;font-size:20px" id="wBonus"></div>
 <div class="btns"><button class="btn" id="wNext">Dalje ▶</button><button class="btn yel" id="wRetry">↻ Opet</button><button class="btn alt" id="wMap">🗺️ Karta</button></div></div></div>
<div class="scr" id="sShop"><div class="panel"><div class="shHead"><button class="rbtn" id="shBack">◀</button><h2>Trgovina</h2><div class="pill" style="margin-left:0"><span class="rg"></span><span id="shRings">0</span></div></div>
 <div id="shUps"></div><h2 style="font-size:32px">Jednorozi</h2><div id="shUnis"></div></div></div>
<div class="scr" id="sEnd"><div class="panel"><h2>🌈 Sve boje su se vratile! 🌈</h2><p style="font-size:26px;font-weight:600">Leona i jednorog spasili su Duginju zemlju. Hvala ti, junakinjo!</p><button class="btn" id="eBack">Početak</button></div></div>
<div id="rot"><div>📱</div>Okreni uređaj vodoravno</div>
<script>
